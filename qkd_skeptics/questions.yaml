# QKD claims question bank
# ========================
# Each question has an `expected` answer (yes|no). A different answer is a
# finding; `unknown` or a missing answer is "unverified" (the vendor has not
# demonstrated it). `weight` (1-3) is how much a miss matters; weight-3 misses
# are treated as critical gaps. `applies_if` makes a question conditional on
# an earlier answer.
#
# Sources behind the questions:
#   - PRIMARY (read in full): "Position Paper on Quantum Key Distribution",
#     joint paper by ANSSI (France), BSI (Germany), NLNCSA (Netherlands) and the
#     Swedish NCSA/Armed Forces. Cited below as "joint paper".
#   - NSA, "Quantum Key Distribution (QKD) and Quantum Cryptography". NOT read
#     directly (the site blocked automated access); NSA points come from secondary
#     summaries. Verify against the NSA page before quoting.
#   - UK NCSC "Quantum security technologies" (2020): not read directly.
#   - ETSI GS QKD 014 (key delivery API); ETSI GS QKD 016 (Common Criteria
#     protection profile for prepare-and-measure QKD, developed with BSI);
#     ISO/IEC 23837-1 and -2 (published 2023, per the joint paper).

questions:
  - id: C1
    category: Claim language
    text: Does the vendor describe the system as "unhackable", "unbreakable" or "quantum-proof" without qualification?
    expected: "no"
    weight: 2
    why: The joint paper says claims of "absolute" or "unconditional" security can never apply to actual implementations; several commercial QKD systems have been broken through their physical devices.

  - id: C2
    category: Claim language
    text: Is the claim scoped to a specific link or segment, not the whole system?
    expected: "yes"
    weight: 2
    why: QKD protects key establishment on one link. Everything outside that link keeps its own risks.

  - id: C3
    category: Claim language
    text: Does the vendor claim "absolute" or information-theoretic security while the QKD keys are used with AES or a similar cipher, not a one-time pad?
    expected: "no"
    weight: 2
    why: Absolute security needs a one-time pad, which needs a QKD key rate equal to the data rate. With AES the claim no longer holds (joint paper).

  - id: J1
    category: Use case
    text: Can the vendor show why PQC or pre-shared symmetric keys cannot meet this requirement, so the cost of QKD is justified?
    expected: "yes"
    weight: 2
    why: The joint paper says QKD is only relevant where the security requirement justifies its very high costs and cheaper options are not feasible.

  - id: A1
    category: Architecture
    text: Are the physical link type (fiber or free-space/satellite) and maximum distance documented?
    expected: "yes"
    weight: 1
    why: Fiber QKD reaches roughly 100 km commercially and a few hundred km in demonstrations, and satellite links are limited by orbit and weather (joint paper). Undocumented links suggest no real deployment.

  - id: A2
    category: Architecture
    text: Does any segment rely on trusted relay nodes?
    expected: "no"
    weight: 2
    why: Over long distances fiber QKD needs trusted nodes, so end-to-end security is not achieved, and in most current implementations satellites are themselves trusted nodes (joint paper). Relays see the keys, so they are high-value targets. Using them is common at range, so this is weighted below the relay-security question (A3).

  - id: A3
    category: Architecture
    applies_if: {A2: "yes"}
    text: Are trusted relay nodes physically secured, monitored, and inside the audit scope?
    expected: "yes"
    weight: 3
    why: If relays are used, the whole security argument rests on them.

  - id: A4
    category: Architecture
    text: Is there a documented fallback if the quantum link is disrupted (fiber cut, or eavesdropping detection tripping)?
    expected: "yes"
    weight: 2
    why: Every eavesdropping attempt, and any interference with the channel, becomes a denial of service, and protecting against it is still unstudied (joint paper). Without a fallback, availability suffers or keys are bypassed.

  - id: B1
    category: Authentication
    text: Is the classical channel used for QKD post-processing authenticated?
    expected: "yes"
    weight: 3
    why: Without authentication, QKD is open to man-in-the-middle attack. This is a core requirement.

  - id: B2
    category: Authentication
    text: Is that authentication quantum-safe (symmetric MACs with pre-shared keys, or PQC signatures) and not RSA/ECDSA?
    expected: "yes"
    weight: 3
    why: The joint paper lists two options, pre-shared keys with symmetric authentication or PQC signatures (which then rely on the PQC scheme). Breakable signatures defeat the purpose.

  - id: B3
    category: Authentication
    text: Is provisioning and refresh of the initial authentication keys documented and controlled?
    expected: "yes"
    weight: 2
    why: Pre-shared authentication keys must be distributed and periodically renewed securely before QKD can run (joint paper).

  - id: K1
    category: Key delivery
    text: Does the key-delivery interface follow a published standard (e.g. ETSI GS QKD 014)?
    expected: "yes"
    weight: 1
    why: Standard interfaces allow independent testing and integration.

  - id: K2
    category: Key delivery
    text: Is the key-delivery / key-management interface protected by TLS 1.2+ with strong authentication?
    expected: "yes"
    weight: 2
    why: Keys cross this classical interface. Weak transport protection exposes them. See the automated endpoint scan below.

  - id: K3
    category: Key delivery
    text: Are QKD-derived keys stored and handled in access-controlled, audited key management (e.g. HSM-grade), with logging of key use?
    expected: "yes"
    weight: 2
    why: A perfectly generated key is only as safe as the system that stores and distributes it after delivery.

  - id: K4
    category: Key delivery
    text: Are key lifetime and rotation rules defined for QKD-derived keys?
    expected: "yes"
    weight: 1
    why: Long-lived keys increase exposure if a single device or relay is compromised.

  - id: U1
    category: Key usage
    text: Are QKD-derived keys used with a strong cipher (AES-256 or equivalent)?
    expected: "yes"
    weight: 2
    why: A perfect key delivered to a weak cipher gives weak protection.

  - id: U2
    category: Key usage
    text: Are QKD keys combined with other keying (PQC hybrid or pre-shared symmetric keys), not relied on alone?
    expected: "yes"
    weight: 2
    why: The joint paper's clear priority is PQC in hybrid with traditional keying. Sole reliance on QKD carries its implementation and availability risks.

  - id: U3
    category: Key usage
    text: Does the same data also travel over links protected only by RSA/ECDH key exchange that the QKD claim does not cover?
    expected: "no"
    weight: 3
    why: Harvest-now-decrypt-later targets the weakest path. A QKD segment does not help if the same data crosses a breakable one.

  - id: E1
    category: Evidence
    text: Has the system been independently evaluated (e.g. ISO/IEC 23837-based Common Criteria evaluation, ETSI GS QKD 016 protection profile)?
    expected: "yes"
    weight: 3
    why: The joint paper says devices need rigorous evaluation because physical attacks exist. A Common Criteria protection profile (ETSI GS QKD 016, developed with BSI) and ISO/IEC 23837-1/-2 (2023) exist, but the paper says an evaluation methodology for physical attacks is still to be developed.

  - id: P1
    category: Evidence
    text: Is the protocol's security proof published, covering finite key sizes and realistic loss and detector imperfections?
    expected: "yes"
    weight: 2
    why: The joint paper says no QKD protocol has been standardised and no proof for a practically relevant protocol meets these requirements. Some commercial protocols lacked sufficient proofs and were later shown insecure.

  - id: E2
    category: Evidence
    text: Has the hardware had independent penetration and side-channel testing (e.g. detector-blinding attacks)?
    expected: "yes"
    weight: 2
    why: Practical attacks target implementation flaws in detectors and optics (e.g. bright-illumination attacks on commercial systems cited in the joint paper), not the protocol.

  - id: E3
    category: Evidence
    text: Are key rate, error rate (QBER) and uptime measured and available for audit?
    expected: "yes"
    weight: 1
    why: Operating metrics show whether the link works as claimed.

  - id: R1
    category: Evidence
    text: Has the random number generator inside the QKD modules been independently evaluated or tested?
    expected: "yes"
    weight: 1
    why: Random number generators are part of the QKD module (joint paper, Figure 1). Biased randomness weakens basis and key selection.

  - id: O1
    category: Operations
    text: Is there a process for patching, updating or replacing the QKD hardware and firmware?
    expected: "yes"
    weight: 2
    why: QKD needs specialised hardware with very high life-cycle costs (joint paper) and cannot be patched like software (NSA objection, from secondary summaries). Lifecycle needs a plan.

  - id: O2
    category: Operations
    text: Is supply-chain provenance of the QKD hardware documented?
    expected: "yes"
    weight: 1
    why: Specialized hardware from few vendors is a supply-chain concentration risk.

  - id: O3
    category: Operations
    text: Is there a PQC migration plan for the organization regardless of QKD?
    expected: "yes"
    weight: 2
    why: The joint paper says the clear priority is migrating to PQC, which runs on classical hardware. QKD is not a substitute.
